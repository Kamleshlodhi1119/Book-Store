<!-- TOP BAR -->
<div class="top-bar">
  <span class="admin-badge">
    <i class="fa-solid fa-shield-halved"></i> Admin Control Panel
  </span>

  <div class="nav-actions" *ngIf="isLoggedIn">
    <span class="welcome-text">
      <i class="fa-solid fa-user-tie"></i> {{ username }}
    </span>
    <button class="logout-link" (click)="logout()">Logout</button>
  </div>
</div>


<header class="main-header">

  <!-- LOGO -->
  <div class="logo">
    <a routerLink="/admin/dashboard">
      <img src="../../../../assets/Logo/Logo.png" />
    </a>
  </div>

  <!-- DESKTOP NAV -->
  <nav class="desktop-nav">
    <ul class="menu">

      <li><a routerLink="/admin/dashboard">Dashboard</a></li>
      <li><a routerLink="/admin/users">Users</a></li>
      <li><a routerLink="/admin/books">Inventory</a></li>
      <li><a routerLink="/admin/orders">Orders</a></li>

      <!-- PROFILE -->
      <li class="profile-wrapper"
          (mouseenter)="onHoverEnter()"
          (mouseleave)="onHoverLeave()">

        <div class="avatar" (click)="toggleProfile($event)">
          {{ initials }}
        </div>

        <div class="profile-dropdown" *ngIf="profileOpen">

          <div class="dropdown-user">
            <div class="avatar-mini">{{ initials }}</div>
            <span>{{ username }}</span>
          </div>

          <a routerLink="/admin/profile">Admin Profile</a>
          <a routerLink="/admin/settings">Settings</a>

          <button (click)="logout()">Logout</button>

        </div>
      </li>

    </ul>
  </nav>

  <!-- MOBILE -->
  <button class="hamburger" (click)="toggleMobileMenu()">
    <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
  </button>

</header>


<!-- MOBILE MENU -->
<div class="mobile-menu" [class.open]="isMenuOpen">

  <a routerLink="/admin/dashboard" (click)="closeMobileMenu()">Dashboard</a>
  <a routerLink="/admin/users" (click)="closeMobileMenu()">Users</a>
  <a routerLink="/admin/books" (click)="closeMobileMenu()">Inventory</a>
  <a routerLink="/admin/orders" (click)="closeMobileMenu()">Orders</a>
  <a routerLink="/admin/profile" (click)="closeMobileMenu()">Profile</a>

  <div class="mobile-auth">
    <span>{{ username }}</span>
    <button (click)="logout()">Logout</button>
  </div>

</div>
