<!-- TOP BAR -->
<div class="top-bar">

  <div class="nav-actions">

    <ng-container *ngIf="!isLoggedIn">
      <button class="auth-link" (click)="openLogin()">Login</button>
      <span class="v-divider"></span>
      <button class="auth-link" (click)="openRegister()">Join Now</button>
    </ng-container>

    <ng-container *ngIf="isLoggedIn">
      <span class="welcome-text">
        <i class="fa-solid fa-envelope"></i> {{ username }}
      </span>
      <button class="logout-link" (click)="logout()">Logout</button>
    </ng-container>

  </div>

</div>


<header class="main-header" [class.shrink]="isScrolled">

  <div class="logo">
    <a routerLink="/home">
      <img src="../../../../assets/Logo/Logo.webp" alt="BookStore home" />
    </a>
  </div>

  <nav class="desktop-nav" aria-label="Main navigation">
    <ul class="menu">

      <li><a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
      <li><a routerLink="/aboutus" routerLinkActive="active-link">About</a></li>
      <li><a routerLink="/shop" routerLinkActive="active-link">Shop</a></li>

      <li><button class="nav-link" (click)="protectedNav('/orders')">Orders</button></li>
      <li><button class="nav-link" (click)="protectedNav('/wishlist')">Wishlist</button></li>

      <li>
        <button (click)="protectedNav('/cart')" class="icon-link" aria-label="Shopping cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </button>
      </li>

      <!-- PROFILE -->
     <li class="profile-wrapper"
    (mouseenter)="onHoverEnter()"
    (mouseleave)="onHoverLeave()">

  <!-- PROFILE ICON -->
  <button type="button" class="avatar" (click)="toggleProfile($event)"
          [attr.aria-expanded]="profileOpen" aria-haspopup="true" aria-label="Open profile menu">
    {{ initials }}
  </button>

  <!-- DROPDOWN -->
  <div class="profile-dropdown" *ngIf="profileOpen">

    <ng-container *ngIf="isLoggedIn; else guest">

      <div class="dropdown-user">
        <div class="avatar-mini">{{ initials }}</div>
        <span>{{ username }}</span>
      </div>

      <a routerLink="/profile">Profile</a>
      <a routerLink="/orders">Orders</a>

      <a *ngIf="role==='ROLE_ADMIN'"
         routerLink="/admin">Admin</a>

      <button (click)="logout()">Logout</button>

    </ng-container>

    <ng-template #guest>
      <button (click)="openLogin()">Login</button>
      <button (click)="openRegister()">Register</button>
    </ng-template>

  </div>
</li>
    </ul>
  </nav>

  <!-- MOBILE -->
  <button class="hamburger" (click)="toggleMobileMenu()"
          [attr.aria-expanded]="mobileMenuOpen" aria-controls="mobile-menu"
          [attr.aria-label]="mobileMenuOpen ? 'Close menu' : 'Open menu'">
    <i class="fa-solid" [ngClass]="mobileMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
  </button>

</header>


<!-- MOBILE MENU -->
<button class="mobile-menu-backdrop" *ngIf="mobileMenuOpen"
        aria-label="Close navigation menu" (click)="closeMobileMenu()"></button>
<nav id="mobile-menu" class="mobile-menu" [class.open]="mobileMenuOpen"
     [attr.aria-hidden]="!mobileMenuOpen" [attr.inert]="mobileMenuOpen ? null : ''"
     aria-label="Mobile navigation">

  <a routerLink="/home" (click)="closeMobileMenu()">Home</a>
  <a routerLink="/shop" (click)="closeMobileMenu()">Shop</a>

  <a (click)="protectedNav('/orders')">Orders</a>
  <a (click)="protectedNav('/wishlist')">Wishlist</a>

  <a (click)="protectedNav('/cart')">Cart</a>
  <a (click)="protectedNav('/profile')">Profile</a>

  <div class="mobile-auth">
    <ng-container *ngIf="!isLoggedIn">
      <button (click)="openLogin()">Login</button>
      <button (click)="openRegister()">Register</button>
    </ng-container>

    <ng-container *ngIf="isLoggedIn">
      <span>{{ username }}</span>
      <button (click)="logout()">Logout</button>
    </ng-container>
  </div>

</nav>
