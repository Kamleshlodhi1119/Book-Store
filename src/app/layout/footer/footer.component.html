<button type="button" class="scroll-top" aria-label="Scroll to top"
        (click)="scrollToTop()" [class.visible]="isVisible">
  <i class="fa fa-arrow-up"></i>
</button>
<footer class="footer">
  <section>
    <div class="footer-container">
      <div class="footer-column logo-section">
        <div class="logo">
          <div class="logo-img">
            <a routerLink="/home">
              <img src="../../../../assets/Logo/Logo.webp" alt="Logo"></a>
          </div>
        </div>
      </div>

      <div class="footer-column">
        <h4>PRODUCT</h4>
        <ul>
          <li><a routerLink="/shop">Shop</a></li>
          <li><a routerLink="/cart">Cart</a></li>
          <li><a routerLink="/wishlist">Wishlist</a></li>
          <li><a routerLink="/orders">My Orders</a></li>
        </ul>
      </div>

      <div class="footer-column">
        <h4>COMPANY</h4>
        <ul>
          <li><a routerLink="/aboutus">About Us</a></li>
          <li><a routerLink="/return-policy">Returns</a></li>
          <li><a routerLink="/privacy-policy">Privacy Policy</a></li>
          <li><a routerLink="/terms-conditions">Terms & Conditions</a></li>
           <li><a routerLink="/api-docs">Apis Document</a></li>
        </ul>
      </div>

      <div class="footer-column newsletter">
        <h4>STAY UP TO DATE</h4>
       <p>Subscribe to our weekly newsletter.</p>
        <form class="subscribe-form" (ngSubmit)="onSubscribe()">
          <input type="email" name="subscriberEmail" aria-label="Email address"
                 placeholder="Enter email" [(ngModel)]="subscriberEmail" required>
          <button type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Subscribing…' : 'Subscribe' }}
          </button>
        </form>
      </div>


    </div>
  </section>

  <section>
    <div class="footer-bottom">
      <div class="social-icons-right">
        <p class="copyright">
          {{ currentYear }}© BookStore |
          <a routerLink="/terms-conditions">Terms</a> |
          <a routerLink="/privacy-policy">Policy</a>
        </p>
      </div>
    </div>
  </section>
</footer>
