<app-user-header></app-user-header>

<!-- HERO BANNER -->
<section class="shop-hero">
  <div class="hero-content">
    <span class="shop-heading">Saved Books</span>

    <p>
      Keep the books you are interested in together for later.
    </p>
  </div>
</section>


<section class="wishlist-container">

  <div *ngIf="loading" class="wishlist-loading" role="status">
    Loading wishlist...
  </div>

  <div *ngIf="!loading && loadFailed" class="empty-wishlist" role="alert">
    <h2>We could not load your wishlist</h2>
    <p>Please check your connection and try again.</p>
    <button type="button" class="wishlist-shop-link" (click)="loadWishlist()">Try again</button>
  </div>

  <div *ngIf="!loading && !loadFailed && list.length === 0" class="empty-wishlist">
    <i class="fa-regular fa-heart" aria-hidden="true"></i>
    <h2>Your wishlist is empty</h2>
    <p>Save a book from the shop and it will appear here.</p>
    <a class="wishlist-shop-link" routerLink="/shop">Browse books</a>
  </div>

  <div class="wishlist-grid" *ngIf="!loading && !loadFailed && list.length">

    <div class="wishlist-card" *ngFor="let w of list; trackBy: trackWishlistItem">

  <div class="book-preview-section">
    <a [routerLink]="['/book-details', w.bookId]">
      <img class="logo-book-preview-img"
          [src]="w.imageUrl || 'assets/book-placeholder.png'"
          [alt]="w.title"
          loading="lazy"
          decoding="async" />
    </a>

    <div class="info">
      <h3><a [routerLink]="['/book-details', w.bookId]">{{ w.title }}</a></h3>
      <p class="price">₹ {{ w.price }}</p>
    </div>
  </div>

  <abbr title="Remove from wishlist">
    <button type="button" class="heart-btn"
            [class.removing]="w.isRemoving"
            [attr.aria-label]="'Remove ' + w.title + ' from wishlist'"
            (click)="handleRemove(w)">
      <svg viewBox="0 0 24 24" class="heart-icon">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
        2 5.42 4.42 3 7.5 3c1.74 0 3.41.81
        4.5 2.09C13.09 3.81 14.76 3
        16.5 3 19.58 3 22 5.42
        22 8.5c0 3.78-3.4
        6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
  </abbr>

</div>


  </div>
</section>
